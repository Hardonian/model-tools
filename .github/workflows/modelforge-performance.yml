name: ModelForge Performance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  performance-regression-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ModelForge Benchmark CLI
        working-directory: packages/benchmark-cli
        run: uv sync --extra dev

      - name: Run ModelForge Performance Regression Evaluation
        working-directory: packages/benchmark-cli
        run: |
          uv run modelforge ci check --config ../../.modelforge.yml

      - name: Verify Compute Passport Freshness
        working-directory: packages/benchmark-cli
        run: |
          uv run modelforge passport Qwen/Qwen2.5-32B-Instruct
          uv run modelforge badge Qwen/Qwen2.5-32B-Instruct
