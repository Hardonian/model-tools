name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  node-workspace:
    name: Node Packages & Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build & Typecheck
        run: npx turbo run build

      - name: Run Unit Tests
        run: npx turbo run test

  python-cli:
    name: Python Benchmark CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: packages/benchmark-cli
        run: uv sync --extra dev

      - name: Run Lint
        working-directory: packages/benchmark-cli
        run: uv run ruff check .

      - name: Run Unit Tests
        working-directory: packages/benchmark-cli
        run: uv run pytest tests/
